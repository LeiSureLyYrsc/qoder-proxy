version: '3.8'

services:
  qoder-proxy:
    build: .
    image: qoder-proxy:latest
    container_name: qoder-proxy
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data       # 持久化账号和 CLI 凭证数据
      - ./.env:/app/.env:ro    # 挂载环境变量配置文件（只读）
    environment:
      - NODE_ENV=production